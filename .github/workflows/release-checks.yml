name: Release checks

# What a one-click update relies on, against the live release: its signature and files.
# Network-bound, so weekly, after each release, and only on the PRs that change the check.
on:
  pull_request:
    paths:
      - scripts/verify-release.sh
      - scripts/verify-release.test.sh
      - .github/workflows/release-checks.yml
  schedule:
    - cron: "0 7 * * 1"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to check, such as v0.3.0 (default the latest)
        required: false

permissions:
  contents: read

jobs:
  signature:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Self-test, so the check below is known to fail when it should
        run: scripts/verify-release.test.sh
      - name: Signature and files of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          tag=$TAG
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName) || exit 3
          fi
          scripts/verify-release.sh "$tag"

