[package]
name = "deskpuck-ble"
description = "Bluetooth LE connection to a Joy-Con 2 for Deskpuck"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.9.3"
btleplug = "0.13.4"
deskpuck-core = { path = "../deskpuck-core" }
deskpuck-inject = { path = "../deskpuck-inject" }
futures = "0.3"
getrandom = "0.4.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
uuid = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
tokio = { version = "1", features = ["net"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Devices_Bluetooth", "Foundation"] }

[dev-dependencies]
tempfile = "3.27.0"

# Only builds on Windows embed the icon; a build dependency's cfg is the host's
# (see ../icons/embed.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
