[package]
name = "deskpuck-ble"
description = "Bluetooth LE connection to a Joy-Con 2 for Deskpuck"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
btleplug = "0.13.4"
deskpuck-core = { path = "../deskpuck-core" }
deskpuck-inject = { path = "../deskpuck-inject" }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
uuid = "1"

[dev-dependencies]
tempfile = "3.27.0"
