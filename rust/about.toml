# cargo-about settings for THIRD-PARTY-NOTICES.txt in the Linux and Windows
# releases (scripts/package.sh). The accepted licences mirror deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
