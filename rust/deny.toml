# cargo deny check: known advisories, dependency licenses, and crate sources.

[advisories]
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# Public-domain dedication; scoped to the one crate that needs it (the
# Linux tray backend) rather than allowed everywhere.
exceptions = [{ crate = "ksni", allow = ["Unlicense"] }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
