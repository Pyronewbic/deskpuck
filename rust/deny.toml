[advisories]
yanked = "deny"
# Unmaintained, not vulnerable: folded into zbus 6, but eframe's accessibility
# (accesskit_unix) still needs zbus 5. Drop these once it moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6, needed by eframe via zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6, needed by eframe via zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6, needed by eframe via zbus 5" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# Scoped to the crate that needs each: ksni (Linux tray), the rest come with
# the settings window's egui (clipboard, library loading, bundled fonts).
exceptions = [
    { crate = "ksni", allow = ["Unlicense"] },
    { crate = "clipboard-win", allow = ["BSL-1.0"] },
    { crate = "error-code", allow = ["BSL-1.0"] },
    { crate = "libloading", allow = ["ISC"] },
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
